<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviso de Outlook (Versión Web)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Carga de Socket.IO -->
    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
    <style>
        body {
            background-color: #f4f6f9;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 600px;
            margin-top: 50px;
        }
        .card {
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        #log-box {
            background-color: #1e1e1e;
            color: #00ff00;
            font-family: monospace;
            font-size: 13px;
            height: 250px;
            resize: none;
            width: 100%;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h4 class="fw-bold mb-4">Aviso de Outlook (Versión Web)</h4>
        
        <form id="bot-form">
            <div class="mb-3">
                <label for="correo" class="form-label fw-bold">Correo de Outlook:</label>
                <input type="email" id="correo" class="form-control" placeholder="ejemplo@outlook.com" required>
            </div>
            
            <div class="mb-3">
                <label for="id_recuperacion" class="form-label fw-bold">ID de recuperación en Byom:</label>
                <input type="text" id="id_recuperacion" class="form-control" placeholder="id_ejemplo" required>
            </div>
            
            <button type="submit" id="btn-conectar" class="btn btn-primary fw-bold">CONECTAR</button>
        </form>

        <h5 class="fw-bold mt-4">Registro de Actividad</h5>
        <textarea id="log-box" readonly placeholder="Esperando inicio de proceso..."></textarea>
    </div>
</div>

<script>
    // Inicializar conexión WebSocket
    const socket = io();

    const form = document.getElementById('bot-form');
    const logBox = document.getElementById('log-box');

    // Escuchar eventos de log desde el servidor en tiempo real
    socket.on('log_event', function(msg) {
        logBox.value += msg.data + '\n';
        logBox.scrollTop = logBox.scrollHeight;
    });

    // Enviar formulario mediante Socket.IO al servidor
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const correo = document.getElementById('correo').value;
        const id_recuperacion = document.getElementById('id_recuperacion').value;

        logBox.value = '=== INICIANDO PROCESO ===\n';
        
        socket.emit('iniciar_bot', {
            correo: correo,
            id_recuperacion: id_recuperacion
        });
    });
</script>

</body>
</html>
